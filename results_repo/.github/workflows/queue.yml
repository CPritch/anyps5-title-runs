# The queue workflow: AnyPS5's label and /title-test comment events -> queue.json, the App's reactions and comment.
# Events come from the App's webhook, forwarded here as repository_dispatch (type anyps5-event, client_payload
# {"event": <X-GitHub-Event>, "payload": <the webhook payload>}); the schedule refreshes each queued PR's head and state.
name: queue
on:
  repository_dispatch:
    types: [anyps5-event]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: results-repository
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (claims and results; testers write it) as data
        uses: actions/checkout@v4
        with:
          path: data
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the state branch (config, queue, comments; only workflows and maintainers write it)
        uses: actions/checkout@v4
        with:
          path: state
          ref: state
      - name: Check out the tool at the commit the maintainers pinned (nothing from this repository runs)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TITLE_RUNS_TOOL_REPOSITORY }}
          ref: ${{ vars.TITLE_RUNS_TOOL_COMMIT }}
          path: tool
          token: ${{ secrets.TITLE_RUNS_TOOL_TOKEN || github.token }}
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TITLE_RUNS_APP_ID }}
          private-key: ${{ secrets.TITLE_RUNS_APP_PRIVATE_KEY }}
          owner: ${{ vars.ANYPS5_OWNER }}
          repositories: ${{ vars.ANYPS5_NAME }}
      - name: AnyPS5's history, for the patch-ids of pushes after approval (no blobs until a patch needs them)
        run: |
          git init --quiet --bare anyps5.git
          git --git-dir anyps5.git remote add origin "https://github.com/${{ vars.ANYPS5_OWNER }}/${{ vars.ANYPS5_NAME }}.git"
          git --git-dir anyps5.git config remote.origin.promisor true
          git --git-dir anyps5.git config remote.origin.partialclonefilter blob:none
          git --git-dir anyps5.git fetch --quiet --filter=blob:none origin main:refs/remotes/origin/main
      - name: Queue
        env:
          TITLE_RUNS_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -I tool/title-runs relay queue --state state --data data --event-name "${{ github.event_name }}" --event-file "$GITHUB_EVENT_PATH" --anyps5-git anyps5.git --anyps5-remote origin --main-ref origin/main
      - name: Commit queue.json comments.json to the state branch
        if: always()
        working-directory: state
        run: |
          git config user.name "title-runs[bot]"
          git config user.email "title-runs[bot]@users.noreply.github.com"
          git add queue.json comments.json
          git diff --cached --quiet && exit 0
          git commit --quiet -m "queue: ${{ github.event_name }}"
          for attempt in 1 2 3; do git pull --quiet --rebase origin state && git push --quiet origin HEAD:state && exit 0; sleep 5; done
          exit 1
