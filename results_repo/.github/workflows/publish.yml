# The publish workflow: a tester's push of claims and results -> checked results -> the App's comment on the PR.
# Its own commits go to the state branch, which this workflow does not watch. A push that touches anything other
# than the pusher's claims and results is refused whole (the tool's title_runs/relay/publish.py).
name: publish
on:
  push:
    branches: [main]
    paths: ["results/**", "claims/**"]
concurrency:
  group: results-repository
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main (claims and results; testers write it) as data
        uses: actions/checkout@v4
        with:
          path: data
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the state branch (config, queue, comments; only workflows and maintainers write it)
        uses: actions/checkout@v4
        with:
          path: state
          ref: state
      - name: Check out the tool at the commit the maintainers pinned (nothing from this repository runs)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TITLE_RUNS_TOOL_REPOSITORY }}
          ref: ${{ vars.TITLE_RUNS_TOOL_COMMIT }}
          path: tool
          token: ${{ secrets.TITLE_RUNS_TOOL_TOKEN || github.token }}
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TITLE_RUNS_APP_ID }}
          private-key: ${{ secrets.TITLE_RUNS_APP_PRIVATE_KEY }}
          owner: ${{ vars.ANYPS5_OWNER }}
          repositories: ${{ vars.ANYPS5_NAME }}
      - name: Publish
        env:
          TITLE_RUNS_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -I tool/title-runs relay publish --state state --data data --actor "${{ github.actor }}" --before "${{ github.event.before }}" --after "${{ github.sha }}"
      - name: Commit comments.json to the state branch
        if: always()
        working-directory: state
        run: |
          git config user.name "title-runs[bot]"
          git config user.email "title-runs[bot]@users.noreply.github.com"
          git add comments.json
          git diff --cached --quiet && exit 0
          git commit --quiet -m "publish: ${{ github.sha }}"
          for attempt in 1 2 3; do git pull --quiet --rebase origin state && git push --quiet origin HEAD:state && exit 0; sleep 5; done
          exit 1
