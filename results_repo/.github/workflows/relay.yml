# The results repository's one workflow (DESIGN.md, "Pieces"): every 5 minutes and on demand. It reads AnyPS5's labels,
# commands and new heads as the App, testers' issues and comments here, and writes the state back to this repository.
# Its one secret is the App's private key (APP_PRIVATE_KEY); everything else comes from config.json. The code runs from
# the tool's repository at the commit config.json pins, never from this repository.
name: relay
on:
  schedule:
    - cron: "2/5 * * * *"  # every 5 minutes from minute 2 (2, 7 … 57), off the hour (GitHub delays runs most at the start of an hour); the form GitHub documents
  workflow_dispatch:
concurrency:
  group: relay
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository (the state)
        uses: actions/checkout@v4
        with:
          path: state
      - id: config
        name: Read config.json
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("state/config.json"))
          owner, name = c["repository"].split("/")
          print(f"app_id={c['app']['id']}\nowner={owner}\nname={name}\ntool={c['tool']['repository']}\ncommit={c['tool']['commit']}")
          PY
      - name: Check out the tool at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.tool }}
          ref: ${{ steps.config.outputs.commit }}
          path: tool
          persist-credentials: false
      - id: app
        name: The App's token for AnyPS5
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ steps.config.outputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.name }}
      - name: AnyPS5's history, for the patch-ids of pushes (no blobs until a patch needs them)
        run: |
          git init --quiet --bare anyps5.git
          git --git-dir anyps5.git remote add origin "https://github.com/${{ steps.config.outputs.owner }}/${{ steps.config.outputs.name }}.git"
          git --git-dir anyps5.git config remote.origin.promisor true
          git --git-dir anyps5.git config remote.origin.partialclonefilter blob:none
          git --git-dir anyps5.git fetch --quiet --filter=blob:none origin main:refs/remotes/origin/main
      - name: Relay
        env:
          TITLE_RUNS_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tool/title-runs relay poll --state state --anyps5-git anyps5.git --anyps5-remote origin --main-ref origin/main
      - name: Commit the state
        if: always()
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "relay: $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do git pull --quiet --rebase && git push --quiet && exit 0; sleep 5; done
          exit 1
