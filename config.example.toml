# anyps5-title-runs: the tester's client. The window's first-run walkthrough writes this file for you
# (~/.config/anyps5-title-runs/config.toml on Linux); this example says what each setting is.

# Where builds, caches, game folders and runs live. Game folders hard-link the dump's files, so keep this on the
# same file system as your dumps. Default: ~/.local/share/anyps5-title-runs (Linux), %LOCALAPPDATA% (Windows).
# state_dir = "/path/to/a/big/disk/anyps5-title-runs"

[results]
# The results repository your maintainers named, as OWNER/NAME. The Settings tab or `title-runs client use` switches.
url = "OWNER/NAME"
# "github". (The local stand-in, for development only, is "standin:/path/to/github.json".)
github = "github"

[tester]
# This machine's name in the results repository: 1 to 32 letters, digits and hyphens. Your GitHub account comes
# from signing in.
machine = "my-pc"

[schedule]
# When work may start: when idle (where the computer can tell), within these hours, on mains power, and not while a
# fullscreen program or one of pause_for (process names) runs.
idle_only = true
idle_minutes = 10
mains_only = true
hours = [0, 24]
pause_fullscreen = true
pause_for = []
max_disk_gb = 60
max_job_hours = 3

[source]
# Your clone of AnyPS5, with its submodules; each job makes worktrees from it and leaves your checkout alone.
repo_dir = "/path/to/AnyPS5"
remote = "https://github.com/OWNER/AnyPS5.git"
cmake_args = ["-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release"]

[sandbox]
# "bwrap" (bubblewrap). "none" runs builds and titles without the sandbox; every report then says so.
mode = "bwrap"
# Seconds a title gets to exit after it is asked to stop, before it is killed.
shutdown_wait = 900

# One section per title you own. A title with a route (routes/<ID>.json) gets the timed A/B; one without gets a
# boot check (outcome only).
[titles.PPSA04263]
dump = "/path/to/PPSA04263-app0"
route = "routes/PPSA04263.json"
# GTA V's route needs your profile save (_sd, with the Graphics Mode setting) and save-data memory (_sd_mem), copied
# into the title's game folder before its first run.
# seed = ["/path/to/save/_sd", "/path/to/save/_sd_mem"]
# The scenario its tests run in, by its file name in scenarios/<ID>/; without one, the title's default (GTA V's: the
# prologue, a new game). A scenario with a save has the tool download it, check its sha256 and copy it in over the seed.
# The Titles page lists a title's scenarios.
# scenario = "franklins-house"
# The Graphics Mode your save selects, for the report.
# graphics_mode = "Performance"
